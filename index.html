<!doctype html>
<html lang="en">
  <head>
    <script>
      // HMR: Disabled. Ignore WebSocket errors as per environment constraints.
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&
          (typeof e.reason === 'string'
            ? e.reason.includes('WebSocket') || e.reason.includes('@vite/client')
            : e.reason.message?.includes('WebSocket') ||
              e.reason.message?.includes('vite') ||
              e.reason.stack?.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e &&
          (e.message?.includes('WebSocket') ||
            e.filename?.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
